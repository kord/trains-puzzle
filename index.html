  <title>Train Tracks Puzzle</title>

  <!--
    Resolve the light/dark palette before the first paint, so a stored choice
    never flashes the other theme. Deliberately a classic (non-module) script so
    it runs synchronously. Keep the storage key in sync with src/game/useTheme.ts.
  -->
  <script>
    try {
      var stored = localStorage.getItem('trains.theme')
      document.documentElement.dataset.theme =
        stored === 'light' || stored === 'dark'
          ? stored
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
    } catch (error) {
      document.documentElement.dataset.theme = 'light'
    }
  </script>
</head>
